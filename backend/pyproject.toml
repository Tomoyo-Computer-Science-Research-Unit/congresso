[project]
name = "emendas-rj-backend"
version = "0.1.0"
description = "ETL: emendas parlamentares da bancada fluminense (Portal da Transparencia + Camara + Senado)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "unidecode>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
