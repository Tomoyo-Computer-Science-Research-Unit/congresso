[project]
name = "congresso-backend"
version = "0.1.0"
description = "ETL: emendas parlamentares da bancada fluminense (Portal da Transparencia + Camara + Senado)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "unidecode>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "flake8>=7", "mypy>=1.11", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
